
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whale Tracker Pro</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#f1f5f9;font-family:-apple-system,Arial,sans-serif}
header{padding:22px 16px;background:#17243a}
h1{margin:0;font-size:25px}
small,.muted{color:#aab9cd}
main{padding:14px;max-width:850px;margin:auto}
.panel,.event,.trade{background:#1c2a40;border:1px solid #34455d;border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;color:#b9c9dd;display:block;margin-bottom:5px}
input,select,button{width:100%;padding:11px;border-radius:8px;border:1px solid #53647b;background:#111d30;color:white;font-size:16px}
button{background:#2563eb;border:0;font-weight:600;margin-top:12px}
.secondary{background:#334155}
.stat{font-size:23px;font-weight:bold}
.event h3{margin:0 0 8px;font-size:16px;overflow-wrap:anywhere}
.trade{background:#142036;margin:8px 0;padding:10px}
.line{display:flex;justify-content:space-between;gap:8px;margin:6px 0}
.yes{color:#4ade80}.no{color:#fca5a5}
#status{font-size:13px;margin:12px 0;color:#b9c9dd}
</style>
</head>
<body>
<header>
<h1>🐋 Whale Tracker Pro</h1>
<small>Prediction market trade scanner</small>
</header>
<main>
<div class="panel">
<h3>Trade filters</h3>
<div class="grid">
<div><label>Minimum trade $</label><input id="minBet" type="number" value="500"></div>
<div><label>Maximum trade $</label><input id="maxBet" type="number" value="1000000"></div>
<div><label>Minimum price</label><input id="minPrice" type="number" step=".01" value=".10"></div>
<div><label>Maximum price</label><input id="maxPrice" type="number" step=".01" value=".90"></div>
<div><label>Minimum trader lifetime profit $</label><input id="minProfit" type="number" value="0"></div>
<div><label>Platform</label><select id="platform"><option value="all">All</option><option value="kalshi">Kalshi</option><option value="polymarket">Polymarket</option></select></div>
<div><label>Side</label><select id="side"><option value="all">Both</option><option value="yes">YES</option><option value="no">NO</option></select></div>
<div><label>Display</label><select id="group"><option value="event">Group by event</option><option value="individual">Individual trades</option></select></div>
</div>
<button onclick="loadTrades()">Refresh trades</button>
<button class="secondary" onclick="applyFilters()">Apply filters</button>
</div>

<div class="grid">
<div class="panel"><small>Matching trades</small><div class="stat" id="count">0</div></div>
<div class="panel"><small>Total trade value</small><div class="stat" id="total">$0</div></div>
</div>
<div id="status">Ready to scan.</div>
<div id="results"></div>
</main>
<script>
const API="https://prediction-market-feed-api.mark-smith-9a4.workers.dev/test-trades";
let allTrades=[];
const $=id=>document.getElementById(id);
const money=n=>Number(n).toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits:2});
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function renderTrade(t){
const amount=Number(t.amount_usd||0);
const side=String(t.side||t.taker_side||"unknown").toLowerCase();
return `<div class="trade">
<div class="line"><b>${money(amount)}</b><b class="${side==="yes"?"yes":"no"}">${escapeHTML(side.toUpperCase())}</b></div>
<div class="line"><span>${escapeHTML(t.platform||"Unknown")}</span><span>Price: ${Number(t.price||0).toFixed(2)}</span></div>
<div class="muted">Time: ${escapeHTML(t.executed_at||"Unknown")}</div>
<div class="muted">Trader: ${escapeHTML(t.taker_addr||t.maker_addr||"Not identified")}</div>
<div class="muted">Lifetime profit: ${t.trader_profit==null?"Not available":money(t.trader_profit)}</div>
</div>`;
}
function applyFilters(){
const minBet=Number($("minBet").value)||0;
const maxBet=Number($("maxBet").value)||Infinity;
const minPrice=Number($("minPrice").value)||0;
const maxPrice=Number($("maxPrice").value);
const minProfit=Number($("minProfit").value)||0;
const platform=$("platform").value,side=$("side").value;
const filtered=allTrades.filter(t=>{
const amount=Number(t.amount_usd),price=Number(t.price);
const direction=String(t.side||t.taker_side||"").toLowerCase();
return amount>=minBet&&amount<=maxBet&&price>=minPrice&&price<=maxPrice
&&(platform==="all"||String(t.platform).toLowerCase()===platform)
&&(side==="all"||direction===side)
&&(minProfit===0||(t.trader_profit!=null&&Number(t.trader_profit)>=minProfit));
});
$("count").textContent=filtered.length;
$("total").textContent=money(filtered.reduce((s,t)=>s+Number(t.amount_usd||0),0));
const root=$("results");
if(!filtered.length){root.innerHTML='<div class="panel">No matching trades. Try lowering the minimum trade amount.</div>';return;}
if($("group").value==="individual"){
root.innerHTML=filtered.map(t=>`<div class="event"><h3>${escapeHTML(t.market_id||"Unknown event")}</h3>${renderTrade(t)}</div>`).join("");
return;
}
const groups={};
filtered.forEach(t=>{const key=String(t.event_id||t.market_id||"Unknown event");(groups[key]??=[]).push(t)});
root.innerHTML=Object.entries(groups).sort((a,b)=>b[1].length-a[1].length).map(([event,trades])=>{
const yes=trades.filter(t=>String(t.side||t.taker_side).toLowerCase()==="yes").length;
const no=trades.filter(t=>String(t.side||t.taker_side).toLowerCase()==="no").length;
const unique=new Set(trades.map(t=>t.taker_addr||t.maker_addr).filter(Boolean));
return `<div class="event"><h3>${escapeHTML(event)}</h3>
<div class="line"><span>${trades.length} trades</span><b>${money(trades.reduce((s,t)=>s+Number(t.amount_usd||0),0))}</b></div>
<div class="line"><span class="yes">YES: ${yes}</span><span class="no">NO: ${no}</span></div>
<div class="muted">Identified traders: ${unique.size||"Unavailable"}</div>
${trades.map(renderTrade).join("")}</div>`;
}).join("");
}
async function loadTrades(){
$("status").textContent="Connecting to trade feed...";
try{
const response=await fetch(API);
if(!response.ok)throw Error("HTTP "+response.status);
const data=await response.json();
if(data.error)throw Error(JSON.stringify(data.error));
allTrades=Array.isArray(data.trades)?data.trades:[];
$("status").textContent="Feed responded. "+allTrades.length+" trades received. Data may be delayed or limited by the provider.";
applyFilters();
}catch(e){
$("status").textContent="Connection problem: "+e.message;
}
}
loadTrades();
</script>
</body>
</html>
